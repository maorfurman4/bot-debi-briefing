name: תדריך בוקר דבי

on:
  # 16.11: cron-job.org מפעיל ישירות (workflow_dispatch דרך ה-API של GitHub) — 05:30 mode=morning, 22:00 mode=evening.
  # ה-schedule של GitHub הוסר: הוא איחר בשעות, ובנוסף ל-cron-job.org היה שולח תדריך שני.
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (05:30 — התדריך) / evening (22:00 — מה להביא מחר); שניהם מ-cron-job.org"
        default: morning

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_CALENDAR_ICS_2: ${{ secrets.GOOGLE_CALENDAR_ICS_2 }}
          GOOGLE_CALENDAR_ICS_3: ${{ secrets.GOOGLE_CALENDAR_ICS_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}  # רשות — דיווח תחנות ל-AURA HQ; בלי השניים דבי פשוט לא מדווחת
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}  # רשות — AI רק לאירוע שלא ברשימה; בלי — מדלגים
        run: python bot.py ${{ inputs.mode == 'evening' && '--evening' || '' }}
