name: תדריך בוקר דבי

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (התדריך) / evening (22:00 — מה להביא מחר; נשלח מה-cron של יהלי)"
        default: morning

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_CALENDAR_ICS_2: ${{ secrets.GOOGLE_CALENDAR_ICS_2 }}
          GOOGLE_CALENDAR_ICS_3: ${{ secrets.GOOGLE_CALENDAR_ICS_3 }}
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}  # רשות — AI רק לאירוע שלא ברשימה; בלי — מדלגים
        run: python bot.py ${{ inputs.mode == 'evening' && '--evening' || '' }}
