name: Yehuda Goal Architect Daily Run

on:
  schedule:
    - cron: '0 2 * * *' # רץ ב-07:00 בבוקר שעון ישראל
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r maor_goals/requirement_2.txt
    - name: Run Architect Bot
      env:
        TELEGRAM_TOKEN_YEHUDA: ${{ secrets.TELEGRAM_TOKEN_YEHUDA }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ARCHITECT_GOOGLE_JSON: ${{ secrets.ARCHITECT_GOOGLE_JSON }}
        ARCHITECT_CALENDAR_ID: ${{ secrets.ARCHITECT_CALENDAR_ID }}
        GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
      run: python goals_bot.py
